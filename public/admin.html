<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pannello del ristorante</title>
  <link rel="stylesheet" href="/stile.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="gestore">
  <section id="accesso" class="accesso" hidden>
    <h1>Area riservata</h1>
    <form id="login">
      <label>Email
        <input type="email" name="email" autocomplete="username" placeholder="nome@ristorante.it">
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="errore-login" class="messaggio" role="alert" hidden></p>
      <button class="azione" type="submit">Accedi</button>
    </form>
    <p class="link-accesso"><a href="/accesso#recupera">Password dimenticata?</a> · <a href="/registrati">Non hai un account? Prova gratis</a></p>
    <a href="/">Torna alla pagina di prenotazione</a>
  </section>

  <div id="pannello" hidden>
    <header class="barra">
      <p id="nome-locale" class="nome-locale">Ristorante</p>
      <nav class="menu" aria-label="Sezioni del pannello">
        <a href="#agenda" data-vista="agenda">Agenda</a>
        <a href="#sala" data-vista="sala" title="I tavoli del giorno, in servizio">Sala</a>
        <a href="#ordini" data-vista="ordini">Ordini</a>
        <a href="#menu" data-vista="menu">Menù</a>
        <div class="gruppo-menu">
          <button type="button" class="voce-gruppo" aria-expanded="false" aria-controls="gruppo-clienti">Clienti</button>
          <div id="gruppo-clienti" class="sottomenu" hidden>
            <a href="#clienti" data-vista="clienti">Elenco clienti</a>
            <a href="#fidelity" data-vista="fidelity">Fidelity e gift card</a>
            <a href="#sondaggi" data-vista="sondaggi">Sondaggi</a>
          </div>
        </div>
        <a href="#statistiche" data-vista="statistiche">Statistiche</a>
        <div class="gruppo-menu">
          <button type="button" class="voce-gruppo" aria-expanded="false" aria-controls="gruppo-impostazioni">Impostazioni</button>
          <div id="gruppo-impostazioni" class="sottomenu" hidden>
            <a href="#impostazioni" data-vista="impostazioni">Ristorante e orari</a>
            <a href="#mappa" data-vista="mappa">Disposizione tavoli</a>
            <a href="#account" data-vista="account">Account e utenti</a>
          </div>
        </div>
      </nav>
      <button id="esci" class="esci" type="button">Esci</button>
    </header>
    <p id="ambiente" class="ambiente" hidden></p>
    <p id="stato-account" class="banda" role="status" hidden></p>
    <p id="avviso" class="avviso-pannello" role="status" aria-live="polite"></p>
    <main id="contenuto" class="contenuto"></main>
  </div>

  <dialog id="dialogo" class="dialogo"></dialog>
  <div id="stampa" class="foglio-stampa" aria-hidden="true"></div>
  <script src="/gestione/app.js" type="module"></script>
</body>
</html>
