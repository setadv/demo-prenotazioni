<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pannello del ristorante</title>
  <link rel="stylesheet" href="/stile.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="gestore">
  <section id="accesso" class="accesso" hidden>
    <h1>Area riservata</h1>
    <form id="login">
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="errore-login" class="messaggio" role="alert" hidden></p>
      <button class="azione" type="submit">Accedi</button>
    </form>
    <a href="/">Torna alla pagina di prenotazione</a>
  </section>

  <div id="pannello" hidden>
    <header class="barra">
      <p id="nome-locale" class="nome-locale">Ristorante</p>
      <nav class="menu" aria-label="Sezioni del pannello">
        <a href="#agenda" data-vista="agenda">Agenda</a>
        <a href="#sala" data-vista="sala">Sala</a>
        <a href="#mappa" data-vista="mappa">Mappa tavoli</a>
        <a href="#clienti" data-vista="clienti">Clienti</a>
        <a href="#statistiche" data-vista="statistiche">Statistiche</a>
        <a href="#impostazioni" data-vista="impostazioni">Impostazioni</a>
      </nav>
      <button id="esci" class="esci" type="button">Esci</button>
    </header>
    <p id="ambiente" class="ambiente" hidden></p>
    <p id="avviso" class="avviso-pannello" role="status" aria-live="polite"></p>
    <main id="contenuto" class="contenuto"></main>
  </div>

  <dialog id="dialogo" class="dialogo"></dialog>
  <script src="/gestione/app.js" type="module"></script>
</body>
</html>
